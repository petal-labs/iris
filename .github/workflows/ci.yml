name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build
        run: go build ./... ./contrib/otel/...

      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test ./... ./contrib/otel/...

      - name: Test with race detector
        if: matrix.os == 'macos-latest'
        run: go test -race ./... ./contrib/otel/...

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./... ./contrib/otel/...

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage.out
          path: coverage.out
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: true
          verbose: true

      - name: Vet
        run: go vet ./... ./contrib/otel/...

      - name: Format check
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true

      # Built from source rather than via securego/gosec's Docker action: that
      # image bundles its own Go toolchain with GOTOOLCHAIN=local, so it cannot
      # load a module declaring a newer Go version than the image ships.
      # Installing here compiles gosec with the toolchain setup-go provisioned.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        # G101: env var names (not actual secrets)
        # G104: unhandled errors on non-critical JSON encoding
        # G301/G306: standard CLI permissions (0755 dirs, 0644 files)
        # G304: CLI intentionally handles user-specified paths
        # G404: math/rand for retry jitter (not security-critical)
        # G703: keystore backup path derives from the user's own keystore
        #       location (same rationale as G304); written beside it at 0600
        run: gosec -exclude=G101,G104,G301,G304,G306,G404,G703 -exclude-dir=examples -exclude-dir=contrib ./...
