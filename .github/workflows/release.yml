name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          PKG="github.com/petal-labs/iris/cli/commands"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildDate=${BUILD_DATE}"
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/iris-linux-amd64 ./cmd/iris
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/iris-darwin-amd64 ./cmd/iris
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/iris-darwin-arm64 ./cmd/iris
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/iris-windows-amd64.exe ./cmd/iris

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/iris-linux-amd64
            dist/iris-darwin-amd64
            dist/iris-darwin-arm64
            dist/iris-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
