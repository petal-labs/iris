name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Validate release tag against CHANGELOG
        run: go run ./cmd/releasecheck -tag "${GITHUB_REF_NAME}" -changelog CHANGELOG.md

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          PKG="github.com/petal-labs/iris/cli/commands"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildDate=${BUILD_DATE}"
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/iris-linux-amd64 ./cmd/iris
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/iris-darwin-amd64 ./cmd/iris
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/iris-darwin-arm64 ./cmd/iris
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/iris-windows-amd64.exe ./cmd/iris

      - name: Smoke test Linux release binary
        run: |
          VERSION_OUTPUT="$(./dist/iris-linux-amd64 version)"
          printf '%s\n' "${VERSION_OUTPUT}"
          grep -Fq "iris ${GITHUB_REF_NAME}" <<<"${VERSION_OUTPUT}"

      - name: Inspect release binary metadata
        run: |
          for binary in dist/iris-*; do
            go version -m "${binary}"
          done

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/iris-${{ github.ref_name }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: |
          cd dist
          sha256sum iris-* > checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign release artifacts
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          for file in iris-linux-amd64 iris-darwin-amd64 iris-darwin-arm64 \
                      iris-windows-amd64.exe iris-${GITHUB_REF_NAME}.spdx.json \
                      checksums.txt; do
            cosign sign-blob \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.crt" \
              "${file}"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/iris-linux-amd64
            dist/iris-darwin-amd64
            dist/iris-darwin-arm64
            dist/iris-windows-amd64.exe
            dist/iris-${{ github.ref_name }}.spdx.json
            dist/checksums.txt
            dist/*.sig
            dist/*.crt
          generate_release_notes: true
